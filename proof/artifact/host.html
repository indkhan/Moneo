<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Moneo host proof</title><style>iframe{display:block}</style></head>
<body>
  <button id="reload">Reopen artifact</button><button id="compact">Compact view</button><button id="full">Full view</button><button id="stop">Stop artifact</button>
  <output id="status" aria-live="polite">loading</output>

</body></html>
