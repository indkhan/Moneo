# E01-S01 required CI: install, typecheck, deterministic tests, web build,
# staging image smoke and secret/diff hygiene. A failing required step blocks
# merge (branch protection points at `ci`). Live/bounded gates (artifact
# browsers, Keycloak Docker, OpenRouter probes) stay manual per-story and are
# referenced, not silently skipped, in the ledger.
name: ci

on:
  push:
    branches: ["main", "story/**"]
  pull_request:
    branches: ["main"]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-synthetic-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://moneo_app:ci-synthetic-only@localhost:5432/moneo_ci
      DATABASE_MIGRATION_URL: postgresql://postgres:ci-synthetic-only@localhost:5432/postgres
      DURABLE_PROOF_DB: moneo_durable_proof
      DURABLE_PROOF_REDIS_DB: "15"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Create least-privilege CI roles and databases
        run: |
          PGPASSWORD=ci-synthetic-only psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE moneo_app LOGIN PASSWORD 'ci-synthetic-only';" \
            -c "CREATE DATABASE moneo_ci OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_durable_proof OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_test OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_db OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_tenancy OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_commands OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_policy OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_ui OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_w1 OWNER moneo_app;"
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Harness smoke
        run: npm test
      - name: Web health contract
        run: npm run test:web
      - name: Import fidelity goldens
        run: npm run test:import
      - name: Identity deterministic checks
        run: npm run test:identity
      - name: Auth session contract (real PG)
        run: npm run test:auth
      - name: Migrator atomicity (real PG)
        run: npm run test:db
      - name: Tenant isolation (real PG)
        run: npm run test:tenancy
      - name: Command contracts and money goldens
        run: npm run test:commands && npm run test:money
      - name: AI data policy gate (real PG)
        run: npm run test:policy
      - name: Shell, telemetry and controls
        run: npm run test:ui
      - name: HTTP streaming limits
        run: npm run test:http
      - name: W1 integrated exit demonstration
        run: npm run test:w1
      - name: Durable effects (real PG + Redis)
        run: npm run test:durable
      - name: Deliberate failure must exit nonzero
        run: "! npm run test:failure"
      - name: Web build
        run: npm run build:web
      - name: Diff hygiene
        run: git diff --check
      - name: Secret hygiene (tracked files only)
        run: |
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)"
          test -z "$(git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|aws_secret_access_key|AKIA[0-9A-Z]{16}' -- . ':!.github/workflows/ci.yml' || true)"
          echo "secret scan: no findings in tracked files"

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gates, artifact-security]
    steps:
      - uses: actions/checkout@v4
      - name: Build staging image
        run: docker build -f apps/web/Dockerfile -t moneo-web:staging-candidate --build-arg GIT_SHA="$GITHUB_SHA" .
      - name: Run read-only as non-root, probe /healthz
        run: |
          docker run -d --rm --name moneo-ci-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:3101:3000 moneo-web:staging-candidate
          trap 'docker rm -f moneo-ci-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3101/healthz | grep -q '"status":"ok"'
          test "$(docker exec moneo-ci-smoke id -u)" != "0"
          docker rm -f moneo-ci-smoke
          trap - EXIT

  artifact-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:artifact
