# E01-S01 required CI: install, typecheck, deterministic tests, web build,
# staging image smoke and secret/diff hygiene. A failing required step blocks
# merge (branch protection points at `ci`). Live/bounded gates (artifact
# browsers, Keycloak Docker, OpenRouter probes) stay manual per-story and are
# referenced, not silently skipped, in the ledger.
name: ci

on:
  push:
    branches: ["main", "story/**"]
  pull_request:
    branches: ["main"]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-synthetic-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # MinIO and ClamAV run as explicit docker steps below (service
      # containers cannot take the required server args / slow-start waits).
    env:
      DATABASE_URL: postgresql://moneo_app:ci-synthetic-only@localhost:5432/moneo_ci
      DATABASE_MIGRATION_URL: postgresql://postgres:ci-synthetic-only@localhost:5432/postgres
      DURABLE_PROOF_DB: moneo_durable_proof
      DURABLE_PROOF_REDIS_DB: "15"
      REDIS_URL: redis://localhost:6379
      UPLOADS_ENABLED: "1"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-minio-test-only
      S3_SECRET_KEY: ci-minio-test-only-secret-01
      S3_BUCKET: moneo-ci-upload-test
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3310"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Create least-privilege CI roles and databases
        run: |
          PGPASSWORD=ci-synthetic-only psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE moneo_app LOGIN PASSWORD 'ci-synthetic-only';" \
            -c "CREATE DATABASE moneo_ci OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_durable_proof OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_test OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_db OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_tenancy OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_commands OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_policy OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_ui OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e01_w1 OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e02_jobs OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e02_recovery OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e02_upload OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e02_mapping OWNER moneo_app;" \
      -c "CREATE DATABASE moneo_e08_export OWNER moneo_app;" \
      -c "CREATE DATABASE moneo_e08_deletion OWNER moneo_app;" \
      -c "CREATE DATABASE moneo_e08_retention OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e04_dispatch OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e04_chat OWNER moneo_app;" \
            -c "CREATE DATABASE moneo_e04_tools OWNER moneo_app;"
      - name: Start MinIO + ClamAV test services (synthetic only)
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-test-only -e MINIO_ROOT_PASSWORD=ci-minio-test-only-secret-01 \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          docker run -d --name ci-clamav -p 3310:3310 \
            clamav/clamav:stable@sha256:9cb27d7660bdf66e9878c832cb433dd8aa152cfbe16f3c2c0084c80b04ae22b4
      - name: Wait for object store + scanner (clamd downloads signatures)
        run: node scripts/wait-for-services.mjs
        env:
          WAIT_S3_ENDPOINT: http://localhost:9000
          WAIT_CLAMD_HOST: localhost
          WAIT_CLAMD_PORT: "3310"
          WAIT_TIMEOUT_MS: "420000"
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Harness smoke
        run: npm test
      - name: Web health contract
        run: npm run test:web
      - name: Import fidelity goldens
        run: npm run test:import
      - name: Identity deterministic checks
        run: npm run test:identity
      - name: Auth session contract (real PG)
        run: npm run test:auth
      - name: Migrator atomicity (real PG)
        run: npm run test:db
      - name: Tenant isolation (real PG)
        run: npm run test:tenancy
      - name: Command contracts and money goldens
        run: npm run test:commands && npm run test:money
      - name: AI data policy gate (real PG)
        run: npm run test:policy
      - name: AI dispatch budgets and reconciliation (real PG)
        run: npm run test:ai-dispatch
      - name: Persistent chat and worker loop (real PG + Redis)
        run: npm run test:chat
      - name: Scoped AI tools and evidence (real PG)
        run: npm run test:ai-tools
      - name: Shell, telemetry and controls
        run: npm run test:ui
      - name: HTTP streaming limits
        run: npm run test:http
      - name: W1 integrated exit demonstration
        run: npm run test:w1
      - name: Durable jobs and outbox dispatch (real PG + Redis)
        run: npm run test:jobs
      - name: Job recovery, fencing and cancel (real PG + Redis)
        run: npm run test:job-recovery
      - name: Build parser child (upload worker dependency)
        run: npm run build:parser
      - name: Quarantine upload and bounded parse (real PG + MinIO + ClamAV)
        run: npm run test:upload
      - name: Mapping inference and manual fallback (real PG, stub transport)
        run: npm run test:mapping
      - name: Workspace export lifecycle (real PG + MinIO)
        run: npm run test:export
      - name: Deletion lifecycle and tombstones (real PG + MinIO)
        run: npm run test:deletion
      - name: Retention enforcement and catalog (real PG + MinIO)
        run: npm run test:retention
      - name: Durable effects (real PG + Redis)
        run: npm run test:durable
      - name: Deliberate failure must exit nonzero
        run: "! npm run test:failure"
      - name: Web build
        run: npm run build:web
      - name: Diff hygiene
        run: git diff --check
      - name: Secret hygiene (tracked files only)
        run: |
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)"
          test -z "$(git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|aws_secret_access_key|AKIA[0-9A-Z]{16}' -- . ':!.github/workflows/ci.yml' || true)"
          echo "secret scan: no findings in tracked files"

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gates, artifact-security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Build, configured boot, health and rollback smoke
        run: npm run staging:smoke
        env:
          GIT_SHA: ${{ github.sha }}

  artifact-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:artifact
