name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys only from main through the protected `production`
# environment (required reviewers + no bypass configured in repo settings).
# Staging auto-deploys from main for the Epoch 0 computer-use acceptance.

jobs:
  staging:
    name: deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      GIT_SHA: ${{ github.sha }}
      APP_RELEASE: staging-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Migrations run exactly once via the release pipeline, never on app boot.
      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.STAGING_DATABASE_MIGRATION_URL }}
      - run: echo "staging web/worker deploy hook (provider-specific step lands with E19)"
      - run: curl -fsS "$STAGING_URL/api/v1/version"
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

  production:
    name: deploy production
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    env:
      GIT_SHA: ${{ github.sha }}
      APP_RELEASE: prod-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
      - run: echo "production web/worker deploy hook (provider-specific step lands with E19)"
