# E01-S01 synthetic staging only: disposable app container on a loopback-bound
# port. Postgres/Redis/Keycloak services are added by the stories that consume
# them (S02/S03), reusing the digest pins recorded in apps/web/Dockerfile and
# the E00 identity proof. Production TLS, persistent volumes, backups and
# hosting decisions remain E08 gates.
#
# Usage (synthetic staging smoke):
#   npm run staging:smoke
# which builds, runs, health-checks, demonstrates rollback to the prior tag,
# and removes the disposable containers. No secrets are committed or logged.
name: moneo-e01

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_RELEASE: staging
        GIT_SHA: ${GIT_SHA:-unknown}
    image: moneo-web:staging-candidate
    ports: ["127.0.0.1::3000"]
    environment:
      PORT: "3000"
      APP_RELEASE: staging
      GIT_SHA: ${GIT_SHA:-unknown}
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    networks: [staging]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  staging:
    driver: bridge
